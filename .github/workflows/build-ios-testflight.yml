name: Build Pocket Pet for internal TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique build number for Pocket Pet 0.1
        required: true
        default: "1"
        type: string
      upload_to_testflight:
        description: Upload to internal TestFlight; false is an ephemeral validation-only build
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: pocket-pet-testflight
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 50
    environment: app-store-production
    env:
      APP_VERSION: "0.1"
      APP_BUNDLE_ID: com.krazel.pocketpet
      APPLE_TEAM_ID: B2X6D3A9J9

    steps:
      - name: Check out approved source
        uses: actions/checkout@v5

      - name: Require main and the current App Store toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          if (( sdk_major < 26 )); then
            echo "iOS SDK 26 or newer is required; found ${sdk_version}." >&2
            exit 1
          fi

      - name: Validate build number and signing inputs
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer." >&2
            exit 1
          fi
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required environment secret is missing: ${name}." >&2
              exit 1
            fi
          done

      - name: Test, build, and analyze without signing
        run: bash scripts/verify-macos.sh

      - name: Install and validate distribution signing material
        id: signing
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/distribution.p12"
          profile_path="${RUNNER_TEMP}/distribution.mobileprovision"
          profile_plist="${RUNNER_TEMP}/distribution-profile.plist"
          keychain_path="${RUNNER_TEMP}/pocket-pet-signing.keychain-db"

          printf '%s' "${BUILD_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          printf '%s' "${BUILD_PROVISION_PROFILE_BASE64}" | base64 --decode > "${profile_path}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" -P "${P12_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"

          security cms -D -i "${profile_path}" > "${profile_plist}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist}")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${profile_plist}")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${profile_plist}")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${profile_plist}")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "${profile_plist}")"
          beta_reports_active="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:beta-reports-active' "${profile_plist}")"
          profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "${profile_plist}")"
          expiration_epoch="$(date -j -f '%a %b %d %T %Z %Y' "${profile_expiration}" '+%s')"

          test "${profile_team}" = "${APPLE_TEAM_ID}"
          test "${profile_app_id}" = "${APPLE_TEAM_ID}.${APP_BUNDLE_ID}"
          test "${get_task_allow}" = "false"
          test "${beta_reports_active}" = "true"
          test "${expiration_epoch}" -gt "$(date '+%s')"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "${profile_plist}" >/dev/null 2>&1; then
            echo "An App Store profile must not contain ProvisionedDevices." >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "${profile_plist}" >/dev/null 2>&1; then
            echo "An App Store profile must not contain ProvisionsAllDevices." >&2
            exit 1
          fi

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "profile_name=${profile_name}" >> "${GITHUB_OUTPUT}"
          echo "profile_uuid=${profile_uuid}" >> "${GITHUB_OUTPUT}"
          echo "keychain_path=${keychain_path}" >> "${GITHUB_OUTPUT}"

      - name: Archive signed Release build
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project PocketPetApp/PocketPetApp.xcodeproj \
            -scheme PocketPetApp \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/PocketPet.xcarchive" \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            archive

      - name: Inspect the signed archive
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          app_path="${RUNNER_TEMP}/PocketPet.xcarchive/Products/Applications/PocketPetApp.app"
          executable_path="${app_path}/PocketPetApp"
          test -d "${app_path}"
          test -x "${executable_path}"
          test -f "${app_path}/Assets.car"
          test -f "${app_path}/embedded.mobileprovision"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${app_path}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")" = "${APP_BUNDLE_ID}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app_path}/Info.plist")" = "${APP_VERSION}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app_path}/Info.plist")" = "${BUILD_NUMBER}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${app_path}/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "${app_path}/Info.plist")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${app_path}/Info.plist")" = "Pocket Pet"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "${app_path}/Info.plist")" = "AppIcon"

          signed_entitlements="${RUNNER_TEMP}/signed-entitlements.plist"
          embedded_profile="${RUNNER_TEMP}/embedded-profile.plist"
          /usr/bin/codesign -d --entitlements :- "${app_path}" > "${signed_entitlements}"
          security cms -D -i "${app_path}/embedded.mobileprovision" > "${embedded_profile}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "${signed_entitlements}")" = "${APPLE_TEAM_ID}.${APP_BUNDLE_ID}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "${signed_entitlements}")" = "${APPLE_TEAM_ID}"
          if /usr/libexec/PlistBuddy -c 'Print :get-task-allow' "${signed_entitlements}" >/dev/null 2>&1; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "${signed_entitlements}")" = "false"
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${embedded_profile}")" = "${PROFILE_UUID}"

          required_resources=(
            icon_ball.png icon_heart.png icon_stage_adult.png icon_stage_child.png
            seed_nest_closed_hero.png seed_nest_open_hero.png seed_nest_welcome_background.png
            settings_privacy_shield.png settings_reminder_enabled_bell.png
            settings_reminder_invitation_bell.png settings_reminder_muted_bell.png
            settings_support_envelope.png settings_support_heart.png settings_title_leaf.png
            spriglet_adult_needs_care.png spriglet_adult_neutral.png
            spriglet_adult_sleeping.png spriglet_child_feed.png
            spriglet_child_needs_care.png spriglet_child_sleeping.png
            spriglet_child.png sunny_patio_environment.png
          )
          for resource in "${required_resources[@]}"; do
            test -n "$(find "${app_path}" -type f -name "${resource}" -print -quit)"
          done

      - name: Create App Store Connect export options
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          export_options="${RUNNER_TEMP}/ExportOptions.plist"
          plutil -create xml1 "${export_options}"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "${export_options}"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "${export_options}"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "${export_options}"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "${export_options}"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "${export_options}"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "${export_options}"
          /usr/libexec/PlistBuddy -c 'Add :testFlightInternalTestingOnly bool true' "${export_options}"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "${export_options}"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${APP_BUNDLE_ID} string ${PROFILE_NAME}" "${export_options}"

      - name: Export signed IPA
        id: export
        shell: bash
        run: |
          set -euo pipefail
          export_path="${RUNNER_TEMP}/PocketPet-export"
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/PocketPet.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${export_path}"
          ipa_path="$(find "${export_path}" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "${ipa_path}"
          echo "ipa_path=${ipa_path}" >> "${GITHUB_OUTPUT}"

      - name: Record non-secret build evidence
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          IPA_PATH: ${{ steps.export.outputs.ipa_path }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/pocket-pet-testflight-evidence"
          mkdir -p "${evidence_dir}"
          ipa_hash="$(shasum -a 256 "${IPA_PATH}" | awk '{print $1}')"
          printf '%s\n' \
            "app=Pocket Pet" \
            "marketing_version=${APP_VERSION}" \
            "build=${BUILD_NUMBER}" \
            "commit_sha=${GITHUB_SHA}" \
            "github_run_number=${GITHUB_RUN_NUMBER}" \
            "purpose=TestFlight-Internal" \
            "ipa_sha256=${ipa_hash}" \
            > "${evidence_dir}/manifest.txt"

      - name: Preserve non-secret build evidence
        uses: actions/upload-artifact@v6
        with:
          name: pocket-pet-testflight-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/pocket-pet-testflight-evidence/manifest.txt
          retention-days: 14
          if-no-files-found: error

      - name: Preserve unsigned verification logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocket-pet-testflight-verification-${{ github.run_number }}
          path: .verification-output/
          retention-days: 14
          if-no-files-found: warn

      - name: Require upload credentials
        if: inputs.upload_to_testflight == 'true'
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "Required upload secret is missing: ${name}." >&2
              exit 1
            fi
          done

      - name: Upload the authorized build to internal TestFlight
        if: inputs.upload_to_testflight == 'true'
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IPA_PATH: ${{ steps.export.outputs.ipa_path }}
        run: |
          set -euo pipefail
          api_key_id="$(printf '%s' "${APP_STORE_CONNECT_API_KEY_ID}" | tr -d '\r\n')"
          api_issuer_id="$(printf '%s' "${APP_STORE_CONNECT_ISSUER_ID}" | tr -d '\r\n')"
          private_keys_dir="${GITHUB_WORKSPACE}/private_keys"
          api_key_path="${private_keys_dir}/AuthKey_${api_key_id}.p8"
          cleanup_api_key() {
            rm -f "${api_key_path}"
            rmdir "${private_keys_dir}" 2>/dev/null || true
          }
          trap cleanup_api_key EXIT
          mkdir -p "${private_keys_dir}"
          printf '%s' "${APP_STORE_CONNECT_API_KEY_BASE64}" | base64 --decode > "${api_key_path}"
          test -s "${api_key_path}"
          chmod 600 "${api_key_path}"
          xcrun altool --validate-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${api_key_id}" \
            --apiIssuer "${api_issuer_id}"
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${api_key_id}" \
            --apiIssuer "${api_issuer_id}"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
