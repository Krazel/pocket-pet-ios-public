name: Verify Pocket Pet iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_visual_captures:
        description: Run the complete deterministic F01-F17 visual suite
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pocket-pet-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Require the current App Store toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          if (( sdk_major < 26 )); then
            echo "iOS SDK 26 or newer is required; found ${sdk_version}." >&2
            exit 1
          fi

      - name: Test, build, and analyze the candidate
        run: bash scripts/verify-macos.sh

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocket-pet-ios-verification-${{ github.sha }}
          path: .verification-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  visual:
    if: github.event_name == 'workflow_dispatch' && inputs.run_visual_captures
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Capture and compare the approved F01-F17 suite
        run: bash scripts/run-public-visual-verification.sh

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocket-pet-ios-visual-${{ github.sha }}
          path: .verification-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
